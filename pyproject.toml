[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "creative-toolbox"
version = "0.2.0"
description = "A local-first creative desktop companion for Windows and macOS"
requires-python = ">=3.12"
license = {file = "LICENSE"}
dependencies = [
  "PySide6-Essentials>=6.8,<7",
  "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'",
  "pyobjc-framework-Quartz>=10; sys_platform == 'darwin'",
  "pyobjc-framework-ApplicationServices>=10; sys_platform == 'darwin'",
]

[project.optional-dependencies]
build = ["PyInstaller>=6.16,<7"]

[project.gui-scripts]
creative-toolbox = "creative_toolbox.app:main"

[tool.setuptools.packages.find]
include = ["creative_toolbox*"]
