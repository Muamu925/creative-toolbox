name: Desktop build
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-build.txt
      - name: Test policy and UI
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -v
      - name: Build unsigned desktop package
        run: python tools/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: CreativeToolbox-${{ matrix.os }}-unsigned
          path: dist/
